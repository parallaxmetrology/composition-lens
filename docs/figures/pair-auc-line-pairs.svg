<svg viewBox="0 0 720 190" width="720" height="190" role="img" aria-label="The two line pairs: AUC of the position reading on three sets" xmlns="http://www.w3.org/2000/svg"><style>:root{color-scheme:light;--bg:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s7:#6250d6;--ring:#eb6834;--link:#184f95;--h0:#e8f1fc;--h1:#c7dcf3;--h2:#a2c4eb;--h3:#7aa8dd;--h4:#548bc8;--h5:#376ea9;--h6:#245289;--h7:#0d366b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s7:#9085e9;--ring:#ec835a;--link:#86b6ef;--h0:#262a30;--h1:#2f3a48;--h2:#3a4d66;--h3:#4a6a93;--h4:#5e86bb;--h5:#79a2d6;--h6:#8fb8e8;--h7:#9ec5f4}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s7:#9085e9;--ring:#ec835a;--link:#86b6ef;--h0:#262a30;--h1:#2f3a48;--h2:#3a4d66;--h3:#4a6a93;--h4:#5e86bb;--h5:#79a2d6;--h6:#8fb8e8;--h7:#9ec5f4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:900px;margin:0 auto;padding:36px 16px 80px}h1{font-size:1.9rem;line-height:1.2;margin:0 0 6px}h2{font-size:1.3rem;margin:2.4em 0 .4em;border-top:1px solid var(--grid);padding-top:1em}h3{font-size:1rem;margin:1.6em 0 .3em}
.sub{color:var(--ink2);font-size:.9rem;margin:0 0 1em}nav{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;margin:0 0 1.4em}a{color:var(--link)}code{font-size:.85em}pre{background:var(--surface);border:1px solid var(--grid);border-radius:8px;padding:12px;overflow-x:auto;font-size:.78rem;line-height:1.5}
figure{margin:1.6em 0;background:var(--surface);border:1px solid var(--grid);border-radius:10px;padding:14px 14px 10px}figcaption{font-size:.92rem;color:var(--ink);margin-bottom:6px}.cap{font-size:.84rem;color:var(--ink2);margin:6px 0 0}.read{font-size:.9rem;margin:8px 0 0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.82rem}th,td{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top}th{color:var(--ink2);font-weight:600}details{margin:.6em 0}summary{cursor:pointer;color:var(--ink2);font-size:.85rem}.small{font-size:.84rem;color:var(--ink2)}
svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.t{fill:var(--ink2);font-size:12px}.tb{fill:var(--ink);font-size:12px;font-weight:600}.ts{fill:var(--muted);font-size:11px}.tc{fill:#fff;font-size:10px}
.gl{stroke:var(--grid);stroke-width:1}.chance{stroke:var(--muted);stroke-width:1.1;stroke-dasharray:4 3}.s1{fill:var(--s1)}.s2{fill:var(--s2)}.s3{fill:var(--s3)}.s7{fill:var(--s7)}.sm{fill:var(--muted)}.dot{stroke:var(--surface);stroke-width:1.5}
.eb{stroke-width:2}.eb.s1{stroke:var(--s1);fill:none}.eb.s2{stroke:var(--s2);fill:none}.eb.s3{stroke:var(--s3);fill:none}.eb.s7{stroke:var(--s7);fill:none}.eb.sm{stroke:var(--muted);fill:none}
.ln{fill:none;stroke-width:2;stroke-linejoin:round}.ls1{stroke:var(--s1)}.ls2{stroke:var(--s2)}.ls3{stroke:var(--s3)}.ls7{stroke:var(--s7)}.lsm{stroke:var(--muted)}.lsk{stroke:var(--ink);stroke-width:2;stroke-dasharray:6 4}
.dd.ls1{fill:var(--s1)}.dd.ls2{fill:var(--s2)}.dd.ls3{fill:var(--s3)}.dd.ls7{fill:var(--s7)}.dd.lsm{fill:var(--muted)}.cv0{fill:var(--s1)}.cm{fill:var(--s3);opacity:.7}.cn{fill:var(--grid)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.74rem;white-space:nowrap;border:1px solid var(--axis)}.pill.sol{background:rgba(42,120,214,.12)}.pill.rep{background:rgba(27,175,122,.16)}.pill.exp{background:rgba(237,161,0,.16)}.pill.not{background:var(--grid)}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.ovcard{background:var(--bg);border:1px solid var(--grid);border-radius:8px;padding:6px}.ovcard svg{display:block;border-radius:4px}.ovt{font-size:.78rem;color:var(--ink2);margin-top:4px}.ids{color:var(--muted)}
.ovr{stroke:#fff;stroke-width:1.2;stroke-dasharray:5 4;opacity:.8}.ovl{stroke:#eb6834;stroke-width:2.4}.ovc{fill:none;stroke:#eb6834;stroke-width:2.4}
.band{fill:var(--s1);opacity:.10}.ovl2{stroke:#eb6834;stroke-width:2.2}
.fr2{fill:none;stroke:var(--axis);stroke-width:1.2}
